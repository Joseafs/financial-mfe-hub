name: Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true

jobs:
  validate:
    name: Terraform fmt · validate · plan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Format check
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Validate root module
        shell: bash
        run: |
          terraform -chdir=infrastructure/terraform init -backend=false -input=false
          terraform -chdir=infrastructure/terraform validate

      - name: Validate reusable modules
        shell: bash
        run: |
          for module in shared static-site web-service; do
            terraform -chdir="infrastructure/terraform/modules/$module" init -backend=false -input=false
            terraform -chdir="infrastructure/terraform/modules/$module" validate
          done

      - name: Validate production environment
        shell: bash
        run: |
          terraform -chdir=infrastructure/terraform/environments/production init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/environments/production validate

      - name: Check Render credentials
        id: render-credentials
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
        shell: bash
        run: |
          if [[ -n "$RENDER_API_KEY" && -n "$RENDER_OWNER_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Production plan
        if: steps.render-credentials.outputs.available == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
        run: terraform -chdir=infrastructure/terraform/environments/production plan -input=false -lock=false -out=production.tfplan

      - name: Upload plan
        if: steps.render-credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-production-plan-${{ github.sha }}
          path: infrastructure/terraform/environments/production/production.tfplan
          if-no-files-found: error
          retention-days: 7

      - name: Plan deferred
        if: steps.render-credentials.outputs.available != 'true'
        run: echo "Render credentials are not configured in GitHub Secrets yet; fmt and validate passed, and the authenticated production plan remains a local FMH-044 step."
