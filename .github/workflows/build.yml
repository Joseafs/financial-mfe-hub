name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected-build:
    name: Build affected graph
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml ainda nao esta versionado; usando --no-frozen-lockfile temporariamente."
            pnpm install --no-frozen-lockfile
          fi

      - name: Resolve SCM range
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "TURBO_SCM_HEAD=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "TURBO_SCM_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
            echo "TURBO_SCM_HEAD=${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Show affected packages
        if: github.event_name != 'workflow_dispatch'
        run: pnpm exec turbo ls --affected

      - name: Build affected packages
        if: github.event_name != 'workflow_dispatch'
        run: pnpm exec turbo run build --affected

      - name: Full build on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: pnpm build

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: fmh-build-${{ github.sha }}
          path: |
            apps/shell/dist
            apps/dashboard-mfe/dist
            apps/accounts-mfe/dist
            apps/payments-mfe/dist
            apps/insurance-mfe/dist
            apps/bff/dist
          if-no-files-found: warn
          retention-days: 7
