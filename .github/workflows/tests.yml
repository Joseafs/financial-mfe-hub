name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Gate · ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Format
            command: format:check
          - label: Lint
            command: lint
          - label: Typecheck
            command: typecheck
          - label: Tests
            command: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
            echo "generated_lockfile=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::pnpm-lock.yaml ainda nao esta versionado; usando --no-frozen-lockfile temporariamente."
            pnpm install --no-frozen-lockfile
            echo "generated_lockfile=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ${{ matrix.label }}
        run: pnpm ${{ matrix.command }}

      - name: Export generated lockfile
        if: ${{ always() && matrix.command == 'test' && steps.install.outputs.generated_lockfile == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-pnpm-lock-${{ github.sha }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
