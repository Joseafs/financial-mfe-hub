name: Deploy

run-name: Deploy ${{ inputs.service }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: Servico Render para publicar
        required: true
        type: choice
        options:
          - shell
          - dashboard
          - accounts
          - payments
          - insurance
          - bff

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ inputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Deploy de production deve partir da branch main. Ref recebida: $GITHUB_REF"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve deployable package
        id: deployable
        shell: bash
        run: |
          case "${{ inputs.service }}" in
            shell) package_name="@financial-mfe/shell" ;;
            dashboard) package_name="@financial-mfe/dashboard" ;;
            accounts) package_name="@financial-mfe/accounts" ;;
            payments) package_name="@financial-mfe/payments" ;;
            insurance) package_name="@financial-mfe/insurance" ;;
            bff) package_name="@financial-mfe/bff" ;;
            *)
              echo "::error::Servico invalido: ${{ inputs.service }}"
              exit 1
              ;;
          esac

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build selected deployable
        env:
          PACKAGE_NAME: ${{ steps.deployable.outputs.package_name }}
        run: pnpm --filter "$PACKAGE_NAME" build

      - name: Validation summary
        shell: bash
        run: |
          {
            echo "## Production validation passed"
            echo ""
            echo "- Service: \`${{ inputs.service }}\`"
            echo "- Package: \`${{ steps.deployable.outputs.package_name }}\`"
            echo "- Ref: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ inputs.service }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    env:
      RENDER_DEPLOY_HOOK_SHELL: ${{ secrets.RENDER_DEPLOY_HOOK_SHELL }}
      RENDER_DEPLOY_HOOK_DASHBOARD: ${{ secrets.RENDER_DEPLOY_HOOK_DASHBOARD }}
      RENDER_DEPLOY_HOOK_ACCOUNTS: ${{ secrets.RENDER_DEPLOY_HOOK_ACCOUNTS }}
      RENDER_DEPLOY_HOOK_PAYMENTS: ${{ secrets.RENDER_DEPLOY_HOOK_PAYMENTS }}
      RENDER_DEPLOY_HOOK_INSURANCE: ${{ secrets.RENDER_DEPLOY_HOOK_INSURANCE }}
      RENDER_DEPLOY_HOOK_BFF: ${{ secrets.RENDER_DEPLOY_HOOK_BFF }}

    steps:
      - name: Resolve deploy hook
        id: hook
        shell: bash
        run: |
          case "${{ inputs.service }}" in
            shell) hook="$RENDER_DEPLOY_HOOK_SHELL" ;;
            dashboard) hook="$RENDER_DEPLOY_HOOK_DASHBOARD" ;;
            accounts) hook="$RENDER_DEPLOY_HOOK_ACCOUNTS" ;;
            payments) hook="$RENDER_DEPLOY_HOOK_PAYMENTS" ;;
            insurance) hook="$RENDER_DEPLOY_HOOK_INSURANCE" ;;
            bff) hook="$RENDER_DEPLOY_HOOK_BFF" ;;
            *)
              echo "::error::Servico invalido: ${{ inputs.service }}"
              exit 1
              ;;
          esac

          if [[ -z "$hook" ]]; then
            echo "::error::Deploy hook do Render ainda nao configurado para ${{ inputs.service }}. Configure o secret correspondente no environment production."
            exit 1
          fi

          echo "hook=$hook" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ steps.hook.outputs.hook }}
        shell: bash
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --request POST \
            "$DEPLOY_HOOK"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Render deploy requested"
            echo ""
            echo "- Service: \`${{ inputs.service }}\`"
            echo "- Git ref: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Strategy: \`GitHub Actions -> Render deploy hook\`"
            echo ""
            echo "> Smoke pos-deploy sera automatizado pela FMH-049."
          } >> "$GITHUB_STEP_SUMMARY"
